<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SafeMind Login</title>
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
	<link rel="manifest" href="/manifest.webmanifest">
	<meta name="theme-color" content="#5A5D7A">
	<script>(()=>{let t="";try{t=localStorage.getItem("safemind-theme")||""}catch{}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t})()</script>
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="SafeMind">
	<link rel="stylesheet" href="../css/auth.css">
	<link rel="stylesheet" href="../css/theme.css">
	<link rel="stylesheet" href="../css/brand-palette.css">
</head>
<body class="auth-page" data-auth-page="login">
	<main class="auth-shell">
		<section class="auth-card">
			<a href="main.html" class="auth-card-brand" data-logo-link><img src="/assets/safemind-logo.png" alt=""><span>SafeMind</span></a>
			<h2>Login</h2>
			<p class="subcopy">Use your email account or continue with a social provider.</p>

			<form class="auth-form" data-auth-form novalidate>
				<label for="email">Email</label>
				<input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>

				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="Your password" required>

				<button type="submit" class="auth-button">Login</button>

				<div class="auth-divider">or continue with</div>

				<div class="auth-social">
					<button type="button" class="auth-social-button google" data-provider="google">Continue with Google</button>
					<button type="button" class="auth-social-button microsoft" data-provider="azure">Continue with Microsoft</button>
				</div>

				<p class="auth-footer">Don't have an account? <a href="signup.html">Create one</a></p>
				<p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
			</form>
		</section>
	</main>

	<script type="module" src="../js/auth.js"></script>
</body>
</html>
