<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeMind Education</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#050505">
    <script>(()=>{let t="";try{t=localStorage.getItem("safemind-theme")||""}catch{}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t})()</script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SafeMind">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="dashboard-page" data-page="education">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <a class="dashboard-brand" href="dashboard.html"><img src="/assets/redlogo.png" alt=""><span>SafeMind</span></a>
            <nav class="dashboard-nav" aria-label="Primary navigation">
                <a class="nav-link" href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1Z"/></svg><span>Overview</span></a>
                <a class="nav-link" href="scam-checker.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4M11 8v6M8 11h6"/></svg><span>Scanner</span></a>
                <a class="nav-link" href="reports.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h11l-2 4 2 4H5"/></svg><span>Reports</span></a>
                <a class="nav-link is-active" href="education.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Zm16 0A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"/></svg><span>Education</span></a>
            </nav>
            <button class="mobile-nav-more" type="button" aria-expanded="false" aria-controls="dashboardUtilities" aria-label="More options"><span></span><span></span><span></span></button>
            <div class="dashboard-utilities" id="dashboardUtilities">
                <button class="sidebar-control language-toggle" type="button" data-language-toggle>မြန်မာ</button>
                <button class="sidebar-control logout-control" type="button" data-logout><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5m5-4 4-4-4-4m4 4H9"/></svg><span>Logout</span></button>
            </div>
        </aside>
        <div class="dashboard-main">
            <header class="dashboard-header"><div><p>Education</p><h1>Scam safety guides</h1></div><a class="profile-link" href="profile.html"><span class="avatar" data-avatar>SM</span><span><b class="username">User</b><small>Edit profile</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a></header>
            <main class="dashboard-content">
                <section class="content-card">
                    <div class="section-title"><div><p>Guides</p><h2>Read the warning signs</h2><span>Articles open in a separate browser tab.</span></div></div>
                    <div class="education-filters" role="group" aria-label="Filter education"><button class="is-active" type="button" data-education-filter="all">All</button><button type="button" data-education-filter="phishing">Phishing</button><button type="button" data-education-filter="phone">Phone</button><button type="button" data-education-filter="account">Account safety</button></div>
                    <div class="education-feed" id="educationFeed" aria-live="polite"><p class="empty-state">Loading education...</p></div>
                </section>
                <section class="content-card admin-publish" id="adminPublish" hidden>
                    <div class="section-title"><div><p>Administrator</p><h2>Publish a guide</h2></div></div>
                    <form class="dashboard-form" id="educationForm">
                        <label for="educationTitle">Article title</label><input id="educationTitle" maxlength="140" required>
                        <label for="educationCategory">Category</label><input id="educationCategory" maxlength="60" required>
                        <label for="educationContent">Article content</label><textarea id="educationContent" rows="8" maxlength="10000" required></textarea>
                        <button class="primary-button" type="submit" id="educationSubmit">Publish article</button><p class="form-status" id="educationStatus" role="status" aria-live="polite"></p>
                    </form>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
